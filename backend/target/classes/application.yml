server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: system-design-backend
  datasource:
    url: jdbc:mysql://localhost:3306/eraser
    username: root
    password: toor123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      default-model: ${OLLAMA_MODEL:llama3}
      retries: ${OLLAMA_RETRIES:2}
