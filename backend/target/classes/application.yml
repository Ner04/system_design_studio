server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: system-design-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/eraser;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      default-model: ${OLLAMA_MODEL:llama3}
      retries: ${OLLAMA_RETRIES:2}
      read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:300}
